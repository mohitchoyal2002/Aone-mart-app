name: Android signing tools
on:
  push:
    branches: [main]
    paths: [".github/workflows/apk-tools.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare official Android tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
            unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$RUNNER_TEMP/android-commandline"
            mkdir -p "$sdk_root/cmdline-tools"
            mv "$RUNNER_TEMP/android-commandline/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          fi
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          python3 - "$sdk_manager" <<'PY'
          import subprocess, sys
          subprocess.run([sys.argv[1], '--licenses'], input='y\n' * 100, text=True, check=True, stdout=subprocess.DEVNULL)
          PY
          "$sdk_manager" "build-tools;36.0.0"
          mkdir -p tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" tools/lib/
          chmod +x tools/apksigner tools/zipalign tools/aapt
          sha256sum tools/apksigner tools/zipalign tools/aapt tools/lib/apksigner.jar > tools/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-build-tools-36
          path: tools/
          retention-days: 7
