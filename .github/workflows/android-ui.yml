name: Android Native Smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-ui.yml"
      - "scripts/android-smoke.py"
      - "scripts/download-apk-artifact.py"
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android APK workflow run ID (blank uses latest)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-native-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download and verify compiled APK
        id: apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id || '' }}
        run: python3 scripts/download-apk-artifact.py
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.apk.outputs.source_sha }}
          path: build-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: build-source/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build isolated backend
        working-directory: build-source
        run: |
          npm ci -w @aone/api --no-audit --no-fund
          npm run build:api
      - name: Enable Android tools and KVM
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel on -memory 2048
          script: python3 scripts/android-smoke.py
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-native-test-evidence
          path: |
            qa-output/*.png
            qa-output/*.xml
            qa-output/smoke.json
            qa-output/adb-logcat.txt
            qa-output/api-log.txt
          if-no-files-found: ignore
          retention-days: 14
