name: Backend checks
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "package.json", "package-lock.json", ".github/workflows/backend-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --workspace @aone/api --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck -w @aone/api
      - run: npm run build:api
